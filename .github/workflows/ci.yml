name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# DATABASE_URL is only ever used to generate the Prisma client and to satisfy
# schema validation during `next build` — no step here talks to a real
# database, so a placeholder SQLite path is all that's needed.
env:
  DATABASE_URL: 'file:./dev.db'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
